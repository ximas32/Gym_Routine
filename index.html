<!DOCTYPE html>
<html>
<head>
  <title>Do you even lift bro?</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 📱 PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1e28">
  <link rel="icon" href="icons/icon-192.png">

  <!-- 🍎 iOS -->
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift Bro">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Do you even lift <span>bro?</span></h1>
</header>

<main>
  <div id="createPage" class="hidden"></div>
  <div id="workoutPage"></div>
  <div id="progressPage" class="hidden"></div>
  <div id="statsPage" class="hidden"></div>

  <!-- 💾 Backup -->
  <div id="dataBar">
    <button id="btnExport" onclick="exportData()">⬇️ Backup exportieren</button>
    <button id="btnImport" onclick="document.getElementById('importFile').click()">⬆️ Backup importieren</button>
    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
  </div>
</main>

<!-- 📱 Bottom Navigation -->
<nav id="bottomNav">
  <button id="nav-create" class="nav-btn" onclick="showPage('create')">📝<span>Erstellen</span></button>
  <button id="nav-workout" class="nav-btn active" onclick="showPage('workout')">🏋️<span>Workout</span></button>
  <button id="nav-progress" class="nav-btn" onclick="showPage('progress')">📈<span>Progress</span></button>
  <button id="nav-stats" class="nav-btn" onclick="showPage('stats')">📊<span>Statistik</span></button>
</nav>

<script src="i18n.js"></script>
<script src="storage.js"></script>
<script src="theme.js"></script>
<script src="library.js"></script>
<script src="create.js"></script>
<script src="edit.js"></script>
<script src="animation.js"></script>
<script src="workout.js"></script>
<script src="share.js"></script>
<script src="progress.js"></script>
<script src="bodyweight.js"></script>
<script src="points.js"></script>
<script src="stats.js"></script>
<script src="app.js"></script>

</body>
</html>
