<!DOCTYPE html>
<html>
<head>
  <title>Gym Routine</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 📱 PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1e28">
  <link rel="icon" href="icons/icon-192.png">

  <!-- 🍎 iOS -->
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Fitness App</h2>

<div>
  <button onclick="showPage('create')">Workout erstellen</button>
  <button onclick="showPage('workout')">Workout</button>
  <button onclick="showPage('progress')">Progress</button>
</div>

<hr>

<div id="createPage"></div>
<div id="workoutPage" class="hidden"></div>
<div id="progressPage" class="hidden"></div>

<hr>

<!-- 💾 Backup -->
<div id="dataBar">
  <button onclick="exportData()">Backup exportieren</button>
  <button onclick="document.getElementById('importFile').click()">Backup importieren</button>
  <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
</div>

<script src="storage.js"></script>
<script src="create.js"></script>
<script src="edit.js"></script>
<script src="animation.js"></script>
<script src="workout.js"></script>
<script src="progress.js"></script>
<script src="app.js"></script>

</body>
</html>
